services:
  db:
    image: postgres:17-alpine
    env_file:
      - .env
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:8-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  migrations:
    build: .
    env_file:
      - .env
    entrypoint: ["python", "manage.py"]
    command: ["migrate", "--noinput"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  backend:
    build: .
    env_file:
      - .env
    volumes:
      - media_data:/app/media
    depends_on:
      migrations:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  image-worker:
    build: .
    env_file:
      - .env
    entrypoint: ["celery", "-A", "config", "worker", "--loglevel=INFO"]
    volumes:
      - media_data:/app/media
    depends_on:
      migrations:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  caddy:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    depends_on:
      - backend
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy_data:/data
      - caddy_config:/config

volumes:
  media_data:
  postgres_data:
  caddy_data:
  caddy_config:
