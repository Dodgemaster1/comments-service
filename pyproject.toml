[project]
name = "comments-service"
version = "0.1.0"
requires-python = ">=3.15"
dependencies = [
    "celery[redis]>=5.5.0",
    "channels>=4.3.2",
    "channels-redis>=4.3.0",
    "django>=6.1.2",
    "django-modern-rest[jwt,msgspec,openapi]>=0.16.0",
    "django-redis>=7.0.0",
    "django-simple-captcha>=0.7.0",
    "django-treebeard>=7.0.3",
    "granian>=2.8.5",
    "jinja2>=3.1.6",
    "moka-py>=0.5.0",
    "nh3>=0.3.7",
    "pillow>=13.0.0",
    "psycopg[binary]>=3.2.0",
]

[tool.pyrefly]
project-includes = [
    "**/*.py*",
    "**/*.ipynb",
]

[dependency-groups]
dev = [
    "celery-types>=0.26.0",
    "django-stubs>=6.1.2",
    "pyrefly>=1.4.0",
    "ruff>=0.17.1",
    "rust-just>=1.59.0",
]

[tool.ruff]
line-length = 120
preview = true
extend-exclude = ["manage.py"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
    "assert",
    "any-type",
    "magic-value-comparison",
    "unused-function-argument",
    "D",
]
"comments/migrations/*" = ["undocumented-public-class", "mutable-class-default"]
"comments/models.py" = ["django-nullable-model-string-field"]

[tool.ruff.lint]
extend-select = ["ALL"]
ignore = [
    "undocumented-public-init",
    "undocumented-public-module",
    "undocumented-public-package",
    "incorrect-blank-line-before-class",
    "multi-line-summary-first-line",
    "CPY",
    "TC",
    "T20",
    "ERA",
    "DOC",
    "any-type",
    "blind-except",
    "missing-trailing-comma", # warning
    "no-self-use", # static-method
    "future-rewritable-type-annotation",
    "raise-vanilla-args",
    "try-except-in-loop",
    "unaliased-collections-abc-set-import",
    "try-consider-else",
    "if-else-block-instead-of-if-exp",
    "raw-string-in-exception",
    "explicit-string-concatenation",
]
